name: Windows Build

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          cd windows
          pyinstaller --onefile --windowed --icon=fal/resources/icon.ico --name=Fal4mir main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Fal4mir.exe
          path: windows/dist/Fal4mir.exe

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: windows-${{ github.run_number }}
          release_name: Windows Build ${{ github.run_number }}
          draft: false
          prerelease: false
        id: create_release

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: windows/dist/Fal4mir.exe
          asset_name: Fal4mir.exe
          asset_content_type: application/octet-stream
